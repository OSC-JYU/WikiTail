# Wikitail — Apache reverse proxy on RHEL 9.
#
# Wikitail runs in a rootful podman container bound to 127.0.0.1:3000 (see the
# Quadlet unit). This vhost terminates TLS, authenticates the visitor, and
# forwards to the container, injecting the `mail` header the app trusts for
# identity (AUTH_MODE=header).
#
# Prerequisites:
#   dnf install httpd mod_ssl
#   setsebool -P httpd_can_network_connect on   # SELinux: allow httpd → 127.0.0.1:3000
#   systemctl enable --now httpd
#
# TLS certificate can be issued with certbot (`dnf install python3-certbot-apache`).
# This file assumes /etc/letsencrypt/live/wikitail.example.org/ exists.
#
# Copy to /etc/httpd/conf.d/wikitail.conf and run `apachectl configtest && systemctl reload httpd`.

<VirtualHost *:80>
    ServerName wikitail.example.org
    # Force HTTPS. Everything else goes through :443 below.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName wikitail.example.org
    ServerAdmin admin@example.org

    ErrorLog logs/wikitail_error.log
    CustomLog logs/wikitail_access.log combined

    # ---- TLS ---------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/wikitail.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/wikitail.example.org/privkey.pem
    # Modern profile — Apache 2.4 on RHEL 9 supports TLS 1.3.
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    # ---- Identity header — the security-critical bit ------------------------
    #
    # The app trusts the `mail` request header as the visitor's identity.
    # A client can send that header themselves, so we MUST strip anything the
    # client sends BEFORE we set our own trusted value from the auth layer.
    # `early` runs in the earliest phase, before any authentication modules see
    # the request, which is what makes the strip authoritative.
    RequestHeader unset mail early

    # ---- Authenticate the visitor ------------------------------------------
    #
    # Pick ONE of the blocks below. In every case, the outcome is that
    # REMOTE_USER is set to the visitor's email, which we forward as `mail`.

    # --- Option A: mod_auth_openidc (OpenID Connect / Keycloak / Entra ID) ---
    # dnf install mod_auth_openidc
    #
    # OIDCProviderMetadataURL   https://sso.example.org/realms/main/.well-known/openid-configuration
    # OIDCClientID              wikitail
    # OIDCClientSecret          "changeme"
    # OIDCRedirectURI           https://wikitail.example.org/oidc/callback
    # OIDCCryptoPassphrase      "openssl rand -hex 32 output goes here"
    # OIDCRemoteUserClaim       email
    # OIDCScope                 "openid email profile"
    # <Location />
    #     AuthType openid-connect
    #     Require valid-user
    # </Location>

    # --- Option B: HTTP Basic auth (fine for a small team on TLS) ------------
    # htpasswd -B -c /etc/httpd/wikitail.htpasswd alice@example.org
    #
    # <Location />
    #     AuthType Basic
    #     AuthName "Wikitail"
    #     AuthUserFile /etc/httpd/wikitail.htpasswd
    #     Require valid-user
    # </Location>

    # Forward the authenticated email as the trusted `mail` header. This is
    # the value AUTH_MODE=header reads inside the container.
    RequestHeader set mail "expr=%{REMOTE_USER}"

    # ---- Reverse proxy to the container ------------------------------------
    ProxyPreserveHost   On
    ProxyRequests       Off
    ProxyVia            Off
    ProxyPass           /  http://127.0.0.1:3000/  retry=1 acquire=3000 timeout=60
    ProxyPassReverse    /  http://127.0.0.1:3000/

    # --- Alternative: mounted at a sub-path instead of this vhost's root -----
    # If Wikitail shares a domain with other apps, mount it under a path
    # instead (adjust ServerName/Location auth blocks above accordingly).
    # A bare hostname target (no trailing path) strips the matched prefix
    # before forwarding, so the container itself needs no configuration for
    # this — only the client build does (see `VITE_BASE_PATH` in
    # ../README.md and ../../Dockerfile).
    #
    # ProxyPass        "/s/wikitail" http://localhost:3000
    # ProxyPassReverse "/s/wikitail" http://localhost:3000

    # X-Forwarded-* — hapi does not read them itself, but they help logs and
    # any future rate-limit layer.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    # Uploads can be large (see MAX_UPLOAD_BYTES — 200 MB by default).
    LimitRequestBody 262144000
</VirtualHost>
